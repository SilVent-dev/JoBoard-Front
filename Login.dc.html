<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0}::placeholder{color:#82887A}</style>
</helmet>
<div style="--bg:#F1F3EC;--surface:#FFFFFF;--surface-alt:#E7EBDF;--border:#DCE2D3;--text-primary:#20241E;--text-secondary:#54594B;--text-muted:#82887A;--moss:#3F5D4E;--moss-hover:#35503F;--moss-subtle:rgba(63,93,78,0.12);--clay:#C1652E;font-family:'Inter',system-ui,sans-serif;display:flex;min-height:100vh;background:var(--bg);color:var(--text-primary)">

  <div style="width:400px;flex-shrink:0;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:40px 44px;background:var(--moss)">
    <div style="position:absolute;top:-140px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle, rgba(193,101,46,0.30) 0%, transparent 68%);pointer-events:none"></div>
    <div style="position:absolute;bottom:-100px;left:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 65%);pointer-events:none"></div>

    <div style="position:relative;z-index:1;display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:12px;height:12px;background:var(--clay);transform:rotate(45deg);border-radius:3px"></div></div>
      <span style="font-family:'Source Serif 4',serif;font-weight:600;font-size:18px;letter-spacing:-0.01em;color:#F1F3EC">Marco</span>
    </div>

    <div style="position:relative;z-index:1">
      <p style="font-family:'Source Serif 4',serif;font-size:32px;font-weight:600;line-height:1.25;letter-spacing:-0.01em;color:#F1F3EC;margin:0 0 12px">Cada etapa da<br>sua busca, no lugar certo.</p>
      <p style="font-size:13.5px;color:rgba(241,243,236,0.7);line-height:1.65;margin:0 0 26px">Sem planilha perdida, sem aba<br>esquecida. Só o essencial.</p>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="width:22px;height:6px;border-radius:3px;background:var(--clay)"></span>
        <span style="width:6px;height:6px;border-radius:50%;background:rgba(241,243,236,0.25)"></span>
        <span style="width:6px;height:6px;border-radius:50%;background:rgba(241,243,236,0.25)"></span>
      </div>
    </div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px 64px">
    <div style="width:100%;max-width:392px;padding:44px 44px;border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:0 24px 56px rgba(32,36,30,0.08)">
      <div style="margin-bottom:28px">
        <h2 style="font-family:'Source Serif 4',serif;font-size:25px;font-weight:600;letter-spacing:-0.01em;color:var(--text-primary);margin:0 0 6px">Que bom te ver de novo</h2>
        <p style="font-size:13.5px;color:var(--text-muted);margin:0">Continue de onde parou na sua busca</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase">Email</label>
          <input type="email" placeholder="seu@email.com" style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);color:var(--text-primary);font-size:14px;font-family:inherit;outline:none" />
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase">Senha</label>
          <div style="position:relative;display:flex;align-items:center">
            <input type="{{ senhaInputType }}" placeholder="••••••••" style="width:100%;padding:11px 52px 11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);color:var(--text-primary);font-size:14px;font-family:inherit;outline:none" />
            <button type="button" onclick="{{ toggleSenha }}" style="position:absolute;right:12px;background:none;border:none;color:var(--moss);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:0.02em">{{ toggleLabel }}</button>
          </div>
        </div>

        <button style="margin-top:8px;padding:12px;border:none;border-radius:10px;background:var(--moss);color:#F1F3EC;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(63,93,78,0.25)">Entrar</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin:24px 0;font-size:11px;color:var(--text-muted);letter-spacing:0.08em">
        <span style="flex:1;height:1px;background:var(--border)"></span>ou<span style="flex:1;height:1px;background:var(--border)"></span>
      </div>

      <div style="display:flex;gap:10px">
        <div style="flex:1;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary)">G</div>
        <div style="flex:1;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary)">in</div>
        <div style="flex:1;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary)">gh</div>
      </div>

      <p style="text-align:center;font-size:13px;color:var(--text-muted);margin:24px 0 0">Ainda não tem conta? <a href="Cadastro.dc.html" style="color:var(--moss);font-weight:700;text-decoration:none">Criar conta</a></p>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mostrarSenha: false };
  renderVals() {
    return {
      senhaInputType: this.state.mostrarSenha ? 'text' : 'password',
      toggleLabel: this.state.mostrarSenha ? 'Ocultar' : 'Ver',
      toggleSenha: () => this.setState(s => ({ mostrarSenha: !s.mostrarSenha })),
    };
  }
}
</script>
</body>
</html>
